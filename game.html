<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Collector</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0a0a23;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            border: 2px solid #fff;
            background: linear-gradient(180deg, #1a1a3d, #0a0a23);
            max-width: 100%;
            max-height: 60vh;
        }
        .controls {
            display: none;
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .controls button {
            background: #00f0ff;
            border: 2px solid #fff;
            border-radius: 10px;
            color: #000;
            font-size: 18px;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .controls button:active {
            background: #00a0ff;
        }
        @media (max-width: 600px) {
            .controls {
                display: flex;
                justify-content: space-around;
                flex-wrap: wrap;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
</head>
<body>
    <div class="controls" id="controls">
        <button id="left" ontouchstart="touchControl('left', true)" ontouchend="touchControl('left', false)">⬅️</button>
        <button id="right" ontouchstart="touchControl('right', true)" ontouchend="touchControl('right', false)">➡️</button>
        <button id="up" ontouchstart="touchControl('up', true)" ontouchend="touchControl('up', false)">⬆️</button>
        <button id="down" ontouchstart="touchControl('down', true)" ontouchend="touchControl('down', false)">⬇️</button>
        <button id="pause" ontouchstart="togglePause()">⏯️</button>
    </div>
    <script>
        let player, stars, asteroids, particles, score, gameState, timeLeft, isPaused;
        let touchControls = { left: false, right: false, up: false, down: false };

        function setup() {
            let canvasWidth = min(windowWidth * 0.9, 600);
            let canvasHeight = min(windowHeight * 0.6, 400);
            createCanvas(canvasWidth, canvasHeight);
            player = new Player();
            stars = [];
            asteroids = [];
            particles = [];
            score = 0;
            timeLeft = 120; // 2 минуты
            gameState = 'playing';
            isPaused = false;
            for (let i = 0; i < 10; i++) {
                stars.push(new Star());
            }
            for (let i = 0; i < 5; i++) {
                asteroids.push(new Asteroid());
            }
        }

        function draw() {
            background(10, 10, 35);

            // Фон со звездами
            for (let i = 0; i < 50; i++) {
                fill(255, random(100, 255));
                noStroke();
                ellipse(random(width), random(height), random(1, 3));
            }

            if (gameState === 'playing' && !isPaused) {
                player.update();
                player.show();

                for (let star of stars) {
                    star.update();
                    star.show();
                    if (player.hits(star)) {
                        score += star.isBonus ? 50 : 10;
                        createParticles(star.pos, star.isBonus ? color(255, 0, 0) : color(255, 255, 0));
                        star.reset();
                    }
                }

                for (let asteroid of asteroids) {
                    asteroid.update();
                    asteroid.show();
                    if (player.hits(asteroid)) {
                        createParticles(player.pos, color(255, 100, 0));
                        gameState = 'gameover';
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].show();
                    if (particles[i].isDead()) {
                        particles.splice(i, 1);
                    }
                }

                timeLeft -= 1 / 60;
                if (timeLeft <= 0) {
                    gameState = 'gameover';
                }

                fill(255);
                textSize(20);
                textAlign(LEFT);
                text(`Очки: ${score}`, 10, 30);
                text(`Время: ${floor(timeLeft)}s`, 10, 60);
            } else if (gameState === 'gameover') {
                fill(255);
                textSize(40);
                textAlign(CENTER);
                text('Игра окончена!', width / 2, height / 2 - 20);
                text(`Очки: ${score}`, width / 2, height / 2 + 20);
                textSize(20);
                text('Нажмите R для рестарта', width / 2, height / 2 + 60);
            } else if (isPaused) {
                fill(255);
                textSize(40);
                textAlign(CENTER);
                text('Пауза', width / 2, height / 2);
                textSize(20);
                text('Нажмите P или ⏯️ для продолжения', width / 2, height / 2 + 40);
            }
        }

        function keyPressed() {
            if (key === 'p' || key === 'P') {
                togglePause();
            }
            if (gameState === 'gameover' && key === 'r') {
                resetGame();
            }
        }

        function togglePause() {
            isPaused = !isPaused;
        }

        function touchControl(direction, state) {
            touchControls[direction] = state;
        }

        function resetGame() {
            score = 0;
            timeLeft = 120;
            gameState = 'playing';
            isPaused = false;
            player = new Player();
            stars = [];
            asteroids = [];
            particles = [];
            for (let i = 0; i < 10; i++) {
                stars.push(new Star());
            }
            for (let i = 0; i < 5; i++) {
                asteroids.push(new Asteroid());
            }
        }

        class Player {
            constructor() {
                this.pos = createVector(width / 2, height / 2);
                this.vel = createVector(0, 0);
                this.size = 20;
            }

            update() {
                if (keyIsDown(LEFT_ARROW) || keyIsDown(65) || touchControls.left) this.vel.x -= 0.5;
                if (keyIsDown(RIGHT_ARROW) || keyIsDown(68) || touchControls.right) this.vel.x += 0.5;
                if (keyIsDown(UP_ARROW) || keyIsDown(87) || touchControls.up) this.vel.y -= 0.5;
                if (keyIsDown(DOWN_ARROW) || keyIsDown(83) || touchControls.down) this.vel.y += 0.5;

                this.vel.limit(5);
                this.pos.add(this.vel);
                this.vel.mult(0.95);

                this.pos.x = constrain(this.pos.x, 0, width);
                this.pos.y = constrain(this.pos.y, 0, height);
            }

            show() {
                push();
                translate(this.pos.x, this.pos.y);
                fill(0, 255, 255);
                noStroke();
                triangle(-this.size, this.size, this.size, this.size, 0, -this.size);
                if (frameCount % 10 < 5) {
                    fill(255, 100, 0);
                    ellipse(0, this.size, 10, 10);
                }
                pop();
            }

            hits(obj) {
                let d = dist(this.pos.x, this.pos.y, obj.pos.x, obj.pos.y);
                return d < this.size + obj.size;
            }
        }

        class Star {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.size = 10;
                this.isBonus = random() < 0.2; // 20% шанс бонусной звезды
            }

            update() {
                this.pos.y += 2;
                if (this.pos.y > height) this.reset();
            }

            reset() {
                this.pos = createVector(random(width), -this.size);
                this.isBonus = random() < 0.2;
            }

            show() {
                fill(this.isBonus ? color(255, 0, 0) : color(255, 255, 0));
                noStroke();
                starShape(this.pos.x, this.pos.y, this.size / 2, this.size, 5);
            }
        }

        class Asteroid {
            constructor() {
                this.pos = createVector(random(width), -20);
                this.vel = createVector(random(-1, 1), random(2, 4));
                this.size = random(15, 25);
            }

            update() {
                this.pos.add(this.vel);
                if (this.pos.y > height + this.size) {
                    this.pos = createVector(random(width), -this.size);
                    this.vel = createVector(random(-1, 1), random(2, 4));
                }
            }

            show() {
                fill(100);
                noStroke();
                ellipse(this.pos.x, this.pos.y, this.size * 2);
            }
        }

        class Particle {
            constructor(pos, col) {
                this.pos = pos.copy();
                this.vel = p5.Vector.random2D().mult(random(2, 5));
                this.col = col;
                this.size = random(3, 8);
                this.lifespan = 255;
            }

            update() {
                this.pos.add(this.vel);
                this.lifespan -= 5;
            }

            show() {
                noStroke();
                fill(red(this.col), green(this.col), blue(this.col), this.lifespan);
                ellipse(this.pos.x, this.pos.y, this.size);
            }

            isDead() {
                return this.lifespan <= 0;
            }
        }

        function createParticles(pos, col) {
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(pos, col));
            }
        }

        function starShape(x, y, radius1, radius2, npoints) {
            let angle = TWO_PI / npoints;
            let halfAngle = angle / 2.0;
            beginShape();
            for (let a = 0; a < TWO_PI; a += angle) {
                let sx = x + cos(a) * radius2;
                let sy = y + sin(a) * radius2;
                vertex(sx, sy);
                sx = x + cos(a + halfAngle) * radius1;
                sy = y + sin(a + halfAngle) * radius1;
                vertex(sx, sy);
            }
            endShape(CLOSE);
        }

        function windowResized() {
            let canvasWidth = min(windowWidth * 0.9, 600);
            let canvasHeight = min(windowHeight * 0.6, 400);
            resizeCanvas(canvasWidth, canvasHeight);
        }
    </script>
</body>
</html>
