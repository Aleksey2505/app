<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Invaders</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0a0a23;
            overflow: hidden;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #fff;
            background: #000;
            max-width: 100%;
            max-height: 60vh;
        }
        .controls {
            display: none;
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .controls button {
            background: linear-gradient(45deg, #ff4500, #ff8c00);
            border: 2px solid #fff;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .controls button:hover {
            box-shadow: 0 0 15px #ff4500;
        }
        .controls button:active {
            transform: scale(0.95);
        }
        #restart {
            display: none;
        }
        #score {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 22px;
            text-shadow: 2px 2px 4px #000;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 10px;
        }
        #gameOver {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 32px;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 15px;
            display: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        @media (max-width: 600px) {
            .controls {
                display: flex;
                justify-content: space-around;
                flex-wrap: wrap;
            }
            .controls button {
                font-size: 18px;
                padding: 8px 16px;
            }
            #score {
                font-size: 20px;
            }
            #gameOver {
                font-size: 28px;
                padding: 15px 30px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
</head>
<body>
    <div class="controls" id="controls">
        <button id="left" ontouchstart="touchControl('left', true)" ontouchend="touchControl('left', false)">⬅️</button>
        <button id="right" ontouchstart="touchControl('right', true)" ontouchend="touchControl('right', false)">➡️</button>
        <button id="shoot" ontouchstart="shoot()">🔫 Shoot</button>
        <button id="restart" ontouchstart="resetGame()">🔄 Restart</button>
    </div>
    <div id="score">Score: 0 | Best: 0</div>
    <div id="gameOver">Game Over!<br>Score: 0<br>Tap Restart or press R</div>
    <script>
        let player, enemies, playerBullets, enemyBullets, score, bestScore, gameState, wave;
        let touchControls = { left: false, right: false };
        let particles = [];

        function setup() {
            let canvasWidth = min(windowWidth * 0.9, 600);
            let canvasHeight = min(windowHeight * 0.6, 400);
            createCanvas(canvasWidth, canvasHeight);
            player = new Player();
            enemies = [];
            playerBullets = [];
            enemyBullets = [];
            particles = [];
            score = 0;
            bestScore = localStorage.getItem('invadersBestScore') || 0;
            gameState = 'playing';
            wave = 1;
            spawnWave();
        }

        function spawnWave() {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 8; j++) {
                    enemies.push(new Enemy(50 + j * 50, 50 + i * 40, wave));
                }
            }
        }

        function draw() {
            background(0);

            // Фон со звездами
            for (let i = 0; i < 50; i++) {
                fill(255, random(100, 255) * (0.7 + 0.3 * sin(frameCount * 0.05 + i)));
                noStroke();
                ellipse(random(width), random(height), random(1, 3));
            }

            if (gameState === 'playing') {
                player.update();
                player.show();

                // Обновление пуль игрока
                for (let i = playerBullets.length - 1; i >= 0; i--) {
                    let bullet = playerBullets[i];
                    bullet.update();
                    bullet.show();
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (bullet.hits(enemies[j])) {
                            score += enemies[j].isBonus ? 100 : 10;
                            createParticles(enemies[j].x + enemies[j].size / 2, enemies[j].y + enemies[j].size / 2, enemies[j].isBonus ? color(255, 0, 255) : color(255, 0, 0));
                            enemies.splice(j, 1);
                            playerBullets.splice(i, 1);
                            break;
                        }
                    }
                    if (bullet.isOffScreen()) {
                        playerBullets.splice(i, 1);
                    }
                }

                // Обновление пуль врагов
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    let bullet = enemyBullets[i];
                    bullet.update();
                    bullet.show();
                    if (bullet.hits(player)) {
                        gameState = 'gameover';
                        createParticles(player.x + player.size / 2, player.y + player.size / 2, color(255, 100, 0));
                        document.getElementById('restart').style.display = 'block';
                    }
                    if (bullet.isOffScreen()) {
                        enemyBullets.splice(i, 1);
                    }
                }

                // Обновление врагов
                let edgeReached = false;
                for (let enemy of enemies) {
                    enemy.update();
                    enemy.show();
                    if (enemy.x <= 0 || enemy.x + enemy.size >= width) {
                        edgeReached = true;
                    }
                    if (random() < 0.01) {
                        enemyBullets.push(new Bullet(enemy.x + enemy.size / 2, enemy.y + enemy.size, 2));
                    }
                    if (enemy.y + enemy.size >= player.y) {
                        gameState = 'gameover';
                        document.getElementById('restart').style.display = 'block';
                    }
                }

                // Смещение врагов вниз
                if (edgeReached) {
                    for (let enemy of enemies) {
                        enemy.shiftDown();
                    }
                }

                // Новая волна
                if (enemies.length === 0) {
                    score += 50;
                    wave++;
                    spawnWave();
                }

                // Обновление частиц
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].show();
                    if (particles[i].isDead()) {
                        particles.splice(i, 1);
                    }
                }

                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('invadersBestScore', bestScore);
                }
                document.getElementById('score').textContent = `Score: ${score} | Best: ${bestScore}`;
            } else if (gameState === 'gameover') {
                fill(255);
                textSize(32);
                textAlign(CENTER);
                text('Game Over!', width / 2, height / 2 - 20);
                text(`Score: ${score}`, width / 2, height / 2 + 20);
                textSize(20);
                text('Tap Restart or press R', width / 2, height / 2 + 60);
            }
        }

        function keyPressed() {
            if (key === ' ' && gameState === 'playing') {
                shoot();
            }
            if (gameState === 'gameover' && key === 'r') {
                resetGame();
            }
        }

        function touchControl(direction, state) {
            touchControls[direction] = state;
        }

        function shoot() {
            if (gameState === 'playing' && playerBullets.length < 5) {
                playerBullets.push(new Bullet(player.x + player.size / 2, player.y, -5));
            }
        }

        function resetGame() {
            player = new Player();
            enemies = [];
            playerBullets = [];
            enemyBullets = [];
            particles = [];
            score = 0;
            wave = 1;
            gameState = 'playing';
            spawnWave();
            document.getElementById('restart').style.display = 'none';
        }

        class Player {
            constructor() {
                this.x = width / 2;
                this.y = height - 50;
                this.size = 30;
                this.speed = 5;
            }

            update() {
                if (keyIsDown(LEFT_ARROW) || keyIsDown(65) || touchControls.left) {
                    this.x -= this.speed;
                }
                if (keyIsDown(RIGHT_ARROW) || keyIsDown(68) || touchControls.right) {
                    this.x += this.speed;
                }
                this.x = constrain(this.x, 0, width - this.size);
            }

            show() {
                fill(0, 255, 0);
                rect(this.x, this.y, this.size, this.size);
                if (frameCount % 10 < 5) {
                    fill(255, 100, 0);
                    ellipse(this.x + this.size / 2, this.y + this.size, 10, 10);
                }
            }
        }

        class Enemy {
            constructor(x, y, wave) {
                this.x = x;
                this.y = y;
                this.size = 30;
                this.speed = 1 + wave * 0.2;
                this.direction = 1;
                this.isBonus = random() < 0.1;
            }

            update() {
                this.x += this.speed * this.direction;
            }

            shiftDown() {
                this.y += 20;
                this.direction *= -1;
            }

            show() {
                fill(this.isBonus ? color(255, 0, 255) : color(255, 0, 0));
                rect(this.x, this.y, this.size, this.size);
            }
        }

        class Bullet {
            constructor(x, y, speed) {
                this.x = x;
                this.y = y;
                this.speed = speed;
                this.size = 5;
            }

            update() {
                this.y += this.speed;
            }

            show() {
                fill(255);
                ellipse(this.x, this.y, this.size);
            }

            hits(obj) {
                let d = dist(this.x, this.y, obj.x + obj.size / 2, obj.y + obj.size / 2);
                return d < this.size + obj.size / 2;
            }

            isOffScreen() {
                return this.y < 0 || this.y > height;
            }
        }

        class Particle {
            constructor(x, y, col) {
                this.x = x;
                this.y = y;
                this.vel = p5.Vector.random2D().mult(random(2, 5));
                this.col = col;
                this.size = random(3, 8);
                this.lifespan = 255;
            }

            update() {
                this.x += this.vel.x;
                this.y += this.vel.y;
                this.lifespan -= 5;
            }

            show() {
                noStroke();
                fill(red(this.col), green(this.col), blue(this.col), this.lifespan);
                ellipse(this.x, this.y, this.size);
            }

            isDead() {
                return this.lifespan <= 0;
            }
        }

        function createParticles(x, y, col) {
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(x, y, col));
            }
        }

        function windowResized() {
            let canvasWidth = min(windowWidth * 0.9, 600);
            let canvasHeight = min(windowHeight * 0.6, 400);
            resizeCanvas(canvasWidth, canvasHeight);
            player.x = width / 2;
            player.y = height - 50;
        }
    </script>
</body>
</html>
